  <image x="4" y="4" width="56" height="56" preserveAspectRatio="xMidYMid slice"
         xlink:href="brand/southern-spear-emblem.png" href="brand/southern-spear-emblem.png"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="5.5" fill="none" stroke="#C8AB72" stroke-opacity="0.55"/>
</svg>
